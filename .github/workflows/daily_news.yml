name: Daily News
on:
  schedule:
    # Target 6am Eastern. Cron is UTC-only, so both DST offsets are listed:
    #   10:00 UTC = 6am EDT (summer)   11:00 UTC = 6am EST (winter)
    # The guard below accepts the 6am OR 7am Eastern hour (so a run delayed by
    # GitHub up to ~2h still proceeds) and a .last_run marker ensures it only
    # actually runs once per day.
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
# Never let two runs (e.g. a delayed 6am and the 7am cron) overlap.
concurrency:
  group: daily-news
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decide whether to run (6-7am Eastern, once per day)
        id: guard
        run: |
          today=$(TZ="America/New_York" date +'%Y-%m-%d')
          echo "today=$today" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual run — proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          hour=$(TZ="America/New_York" date +%H)
          if [ "$hour" != "06" ] && [ "$hour" != "07" ]; then
            echo "Eastern hour is $hour (outside 06-07 window) — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(cat .last_run 2>/dev/null || echo "")
          if [ "$last" = "$today" ]; then
            echo "Already ran today ($today) — skipping duplicate."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "In window ($hour ET) and not yet run today — proceeding."
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape the news
        if: steps.guard.outputs.run == 'true'
        run: python scrape.py

      - name: Write carousel copy with Gemini
        if: steps.guard.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python write_carousels.py

      - name: Render carousel HTML
        if: steps.guard.outputs.run == 'true'
        run: python generate_carousels.py

      - name: Install Playwright + Chromium
        if: steps.guard.outputs.run == 'true'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Export slides to PNG
        if: steps.guard.outputs.run == 'true'
        run: python export_slides.py

      - name: Commit the day's output
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "${{ steps.guard.outputs.today }}" > .last_run
          git add .last_run daily_news.json carousel_content.json carousels
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily news + carousels ${{ steps.guard.outputs.today }}"
            git push
          fi

      - name: Email the carousels
        if: steps.guard.outputs.run == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          # Google Workspace / Gmail SMTP. Change these two lines for another provider.
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "SafeTrust carousels — ${{ steps.guard.outputs.today }}"
          to: ykharte@safetrustmtg.com
          from: SafeTrust Carousels <${{ secrets.MAIL_USERNAME }}>
          body: |
            Today's 3 Instagram carousels are attached — 7 slides each (1080x1350 PNG).
            carousel_1 / carousel_2 / carousel_3 = the three stories, in order.
          attachments: carousels/slides/carousel_1/slide_*.png,carousels/slides/carousel_2/slide_*.png,carousels/slides/carousel_3/slide_*.png
