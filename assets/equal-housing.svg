<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 132" fill="none">
  <!-- House outline (open bottom, like the standard Equal Housing Opportunity mark) -->
  <path d="M22 76 L22 41 L65 11 L108 41 L108 76" fill="none" stroke="#ffffff"
        stroke-width="10" stroke-linejoin="round" stroke-linecap="square"/>
  <!-- Equal sign inside the house -->
  <rect x="42" y="44" width="46" height="8.5" rx="2" fill="#ffffff"/>
  <rect x="42" y="59.5" width="46" height="8.5" rx="2" fill="#ffffff"/>
  <!-- Wordmark -->
  <text x="65" y="100" text-anchor="middle" fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700"
        letter-spacing="0.5">EQUAL HOUSING</text>
  <text x="65" y="117" text-anchor="middle" fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700"
        letter-spacing="0.5">OPPORTUNITY</text>
</svg>
