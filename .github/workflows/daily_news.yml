name: Daily News

on:
  schedule:
    # 6am Eastern. Cron is UTC-only, so both offsets are listed and a
    # guard step below skips the run unless it is actually 6am in New York.
    #   10:00 UTC = 6am EDT (summer)
    #   11:00 UTC = 6am EST (winter)
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check it is 6am Eastern
        id: guard
        run: |
          hour=$(TZ="America/New_York" date +%H)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$hour" != "06" ]; then
            echo "Current Eastern hour is $hour, not 06 — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        if: steps.guard.outputs.run == 'true'
        run: python scrape.py

      - name: Commit updated news
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_news.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update daily news $(date -u +'%Y-%m-%d')"
            git push
          fi
