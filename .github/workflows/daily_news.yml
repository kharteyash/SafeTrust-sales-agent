name: Daily News
on:
  schedule:
    # Target early morning Eastern. GitHub delays scheduled runs (often by hours,
    # worst at :00), so we fire several off-peak attempts across the morning and
    # let the guard below accept any run in the 6am-11am Eastern window. A
    # .last_run marker means only the first accepted run each day does the work.
    # Minute :12 avoids top-of-hour congestion. UTC times cover both DST offsets.
    - cron: "12 10 * * *"   # ~6:12 EDT / 5:12 EST
    - cron: "12 11 * * *"   # ~7:12 EDT / 6:12 EST
    - cron: "12 12 * * *"   # ~8:12 EDT / 7:12 EST
    - cron: "12 13 * * *"   # ~9:12 EDT / 8:12 EST
    - cron: "12 14 * * *"   # ~10:12 EDT / 9:12 EST
  # External scheduler (e.g. cron-job.org) POSTs a repository_dispatch at exactly
  # 6:00am ET for on-time delivery; the GitHub crons above are a delayed fallback.
  repository_dispatch:
    types: [daily-run]
  workflow_dispatch:
permissions:
  contents: write
# Never let two runs (e.g. a delayed 6am and the 7am cron) overlap.
concurrency:
  group: daily-news
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decide whether to run (6-11am Eastern, once per day)
        id: guard
        run: |
          today=$(TZ="America/New_York" date +'%Y-%m-%d')
          echo "today=$today" >> "$GITHUB_OUTPUT"
          event="${{ github.event_name }}"

          # Manual runs always proceed (for testing).
          if [ "$event" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Run once per day: skip if today's work is already done.
          last=$(cat .last_run 2>/dev/null || echo "")
          if [ "$last" = "$today" ]; then
            echo "Already ran today ($today) — skipping duplicate."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # External cron controls timing exactly — no time-window check needed.
          if [ "$event" = "repository_dispatch" ]; then
            echo "External trigger — proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # GitHub's own schedule is a delayed fallback — accept the 6-11am ET window.
          hour=$((10#$(TZ="America/New_York" date +%H)))
          if [ "$hour" -lt 6 ] || [ "$hour" -gt 11 ]; then
            echo "Eastern hour is $hour (outside 6-11 morning window) — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Scheduled fallback in window ($hour ET) — proceeding."
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape the news
        if: steps.guard.outputs.run == 'true'
        run: python scrape.py

      - name: Write carousel copy with Gemini
        if: steps.guard.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python write_carousels.py

      - name: Render carousel HTML
        if: steps.guard.outputs.run == 'true'
        run: python generate_carousels.py

      - name: Install Playwright + Chromium
        if: steps.guard.outputs.run == 'true'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Export slides to PNG
        if: steps.guard.outputs.run == 'true'
        run: python export_slides.py

      - name: Commit the day's output
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "${{ steps.guard.outputs.today }}" > .last_run
          git add .last_run daily_news.json carousel_content.json carousels
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily news + carousels ${{ steps.guard.outputs.today }}"
            git push
          fi

      - name: Read carousel titles and captions
        id: titles
        if: steps.guard.outputs.run == 'true'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open("carousel_content.json"))
          for i, c in enumerate(data["carousels"][:3], 1):
              title = c.get("title", f"Carousel {i}").replace("\n", " ").strip()
              caption = c.get("caption", "").replace("\r", "").strip()
              print(f"t{i}={title}")
              print(f"c{i}<<CAPTION_EOF")
              print(caption)
              print("CAPTION_EOF")
          PY

      - name: Email carousel 1
        if: steps.guard.outputs.run == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          # Google Workspace / Gmail SMTP. Change these two lines for another provider.
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Carousel 1/3 — ${{ steps.titles.outputs.t1 }} (${{ steps.guard.outputs.today }})"
          to: pkaur@safetrustmtg.com,malaez@safetrustmtg.com
          from: SafeTrust Carousels <${{ secrets.MAIL_USERNAME }}>
          body: |
            Carousel 1 of 3 — ${{ steps.titles.outputs.t1 }}
            7 slides attached (1080x1350 PNG).

            Caption:
            ${{ steps.titles.outputs.c1 }}
          attachments: carousels/slides/carousel_1/slide_*.png

      - name: Email carousel 2
        if: steps.guard.outputs.run == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Carousel 2/3 — ${{ steps.titles.outputs.t2 }} (${{ steps.guard.outputs.today }})"
          to: pkaur@safetrustmtg.com,malaez@safetrustmtg.com
          from: SafeTrust Carousels <${{ secrets.MAIL_USERNAME }}>
          body: |
            Carousel 2 of 3 — ${{ steps.titles.outputs.t2 }}
            7 slides attached (1080x1350 PNG).

            Caption:
            ${{ steps.titles.outputs.c2 }}
          attachments: carousels/slides/carousel_2/slide_*.png

      - name: Email carousel 3
        if: steps.guard.outputs.run == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Carousel 3/3 — ${{ steps.titles.outputs.t3 }} (${{ steps.guard.outputs.today }})"
          to: pkaur@safetrustmtg.com,malaez@safetrustmtg.com
          from: SafeTrust Carousels <${{ secrets.MAIL_USERNAME }}>
          body: |
            Carousel 3 of 3 — ${{ steps.titles.outputs.t3 }}
            7 slides attached (1080x1350 PNG).

            Caption:
            ${{ steps.titles.outputs.c3 }}
          attachments: carousels/slides/carousel_3/slide_*.png
