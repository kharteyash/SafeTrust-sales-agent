name: Daily News
on:
  schedule:
    # 6am Eastern. Cron is UTC-only, so both offsets are listed and a
    # guard step below skips the run unless it is actually 6am in New York.
    #   10:00 UTC = 6am EDT (summer)
    #   11:00 UTC = 6am EST (winter)
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check it is 6am Eastern
        id: guard
        run: |
          hour=$(TZ="America/New_York" date +%H)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$hour" != "06" ]; then
            echo "Current Eastern hour is $hour, not 06 — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape the news
        if: steps.guard.outputs.run == 'true'
        run: python scrape.py

      - name: Write carousel copy with Claude
        if: steps.guard.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python write_carousels.py

      - name: Render carousel HTML
        if: steps.guard.outputs.run == 'true'
        run: python generate_carousels.py

      - name: Install Playwright + Chromium
        if: steps.guard.outputs.run == 'true'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Export slides to PNG
        if: steps.guard.outputs.run == 'true'
        run: python export_slides.py

      - name: Commit the day's output
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_news.json carousel_content.json carousels
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily news + carousels $(date -u +'%Y-%m-%d')"
            git push
          fi
